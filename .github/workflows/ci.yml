name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dépot
        uses: actions/checkout@v4

      - name: Créer fichier .env (TODO - utilisez les secrets)
        run: |
          echo "MYSQL_HOST = ${{ secrets.MYSQL_HOST  }}" >> .env 
          echo "MONGODB_HOST  =${{  secrets.MONGODB_HOST  }}" >> .env
          echo "MYSQL_DB_NAME =${{  secrets.MYSQL_DB_NAME  }}" >> .env
          echo "MONGODB_NAME  =${{  secrets.MONGODB_NAME  }}" >> .env
          echo "DB_USERNAME =${{  secrets.DB_USERNAME  }}" >> .env
          echo "DB_PASSWORD =${{  secrets.DB_PASSWORD  }}" >> .env
          echo "MONGO_INITDB_ROOT_USERNAME  =${{  secrets.MONGO_INITDB_ROOT_USERNAME  }}" >> .env
          echo "MONGO_INITDB_ROOT_PASSWORD  =${{  secrets.MONGO_INITDB_ROOT_PASSWORD  }}" >> .env

      - name: Démarrer le conteneur
        run: |
          docker network create labo01-network
          docker compose up -d

      - name: Attendre MySQL
        run: |
          sleep 10
          timeout=60
          until docker exec mysql mysqladmin ping -h localhost -u root -proot --silent; do
            echo "Waiting for MySQL..."
            sleep 3
            timeout=$((timeout - 3))
            if [ $timeout -le 0 ]; then
              echo "MySQL failed to start"
              exit 1
            fi
          done
          sleep 5

      - name: Éxécuter les tests (TODO - ajouter test_products)
        run: docker exec store_manager_cli pytest ./src/tests/test_user.py

      - name: Cleanup
        if: always()
        run: docker compose down -v